# This is a basic workflow to help you get started with Actions

name: Deploy Portfolio to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push event but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions required to write on Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents concurrent builds from happening
concurrency:
  group: "pages"
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build_and_deploy"
  build_and_deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
       - name: Code checkout
         uses: actions/checkout@v4
        
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 20

       - name: TypeScript compilation
         run: |
           npm install -g typescript
           tsc

       - name: Pages configration
         uses: actions/configure-pages@v4

       - name: Artifact loading
         uses: actions/upload-pages-artifact@v3
         with:
           path: '.' # Carica l'intera root del progetto, che ora include i .js appena compilati

       - name: Deploy on GitHub Pages
         id: deployment
         uses: actions/deploy-pages@v4
